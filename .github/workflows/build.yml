name: Build noxssh

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.platform_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_name: Linux x86_64
            artifact_suffix: linux-x86_64
          - os: ubuntu-24.04-arm
            platform_name: Linux ARM64
            artifact_suffix: linux-arm64
          - os: macos-15-intel
            platform_name: macOS x86_64
            artifact_suffix: macos-x86_64
          - os: macos-15
            platform_name: macOS ARM64
            artifact_suffix: macos-arm64

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Build Debian package
        if: runner.os == 'Linux'
        run: |
          cmake --build build --target package
          mkdir -p dist/debian
          cp build/*.deb dist/debian/

      - name: Verify binaries
        shell: bash
        run: |
          set -euo pipefail
          test -f bin/noxssh
          if [[ "${{ runner.os }}" == "Linux" ]]; then test -f bin/noxsshd; fi

      - name: CTest
        if: runner.os != 'Windows'
        run: cd build && ctest --output-on-failure

      - name: CTest (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cd build; ctest -C Release --output-on-failure

      - name: Smoke noxsshd (Unix)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/ci_smoke_sshd.sh
